  <!--
    ESTADÍSTICAS DE VISITAS: el Umami de Pimon (stats.pimon3d.com), sin cookies. La web es la
    que fue de Gasofa, renombrada a Agarrao (mismo Website ID: el historial sigue).
    · data-domains: solo cuenta en agarrao.pimon.dev, no en localhost.
    · data-exclude-search: no manda la query de la URL.
    · data-before-send: /unirse/<código> lleva el código de invitación a una casa en la RUTA;
      se manda como /unirse a secas para que el código no acabe en la base de Umami.
    Si cambia, cambia también la política de privacidad (app/legal/privacidad.page.ts).
  -->
  <script>
    function agarraoAntesDeUmami(tipo, datos) {
      // También el referrer: al navegar dentro de la app, Umami pone ahí la página anterior.
      ['url', 'referrer'].forEach(function (campo) {
        if (datos && typeof datos[campo] === 'string') {
          datos[campo] = datos[campo].replace(/\/unirse\/[^/?#]+/, '/unirse');
        }
      });
      return datos;
    }
  </script>
  <script defer src="https://stats.pimon3d.com/script.js"
          data-website-id="1b38e508-2e1b-4370-abc2-6578012fd32a"
          data-domains="agarrao.pimon.dev"
          data-exclude-search="true"
          data-before-send="agarraoAntesDeUmami"></script>
