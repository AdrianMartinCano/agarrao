<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="Listillo, la lista con gafas">
  <!-- Sombra en el suelo -->
  <ellipse cx="80" cy="148" rx="44" ry="7" fill="#2A2F5A" opacity=".12"/>
  <!-- La hoja de la lista: papel con el borde de abajo rasgado como un ticket -->
  <g transform="rotate(-5 80 80)">
    <path d="M38 22 Q38 12 48 12 H112 Q122 12 122 22 V128 l-7 7 -7 -7 -7 7 -7 -7 -7 7 -7 -7 -7 7 -7 -7 -7 7 -7 -7 -7 7 -6 -7 Z" fill="#FFFFFF"/>
    <path d="M38 22 Q38 12 48 12 H112 Q122 12 122 22 V40 H38 Z" fill="#E4DCFF"/>
    <!-- Renglones: dos tachados, uno pendiente -->
    <g stroke-linecap="round">
      <path d="M56 104 H104" stroke="#D9D4EE" stroke-width="5"/>
      <path d="M56 118 H92" stroke="#D9D4EE" stroke-width="5"/>
      <path d="M46 103 l4 4 7-8" stroke="#FF4F8B" stroke-width="4" fill="none" stroke-linejoin="round"/>
      <path d="M46 117 l4 4 7-8" stroke="#FF4F8B" stroke-width="4" fill="none" stroke-linejoin="round"/>
    </g>
    <!-- Gafas redondas -->
    <g fill="#FFFFFF" stroke="#2A2F5A" stroke-width="4.5">
      <circle cx="64" cy="66" r="13"/>
      <circle cx="96" cy="66" r="13"/>
    </g>
    <path d="M77 66 Q80 62 83 66" stroke="#2A2F5A" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Ojos: el derecho guiña, que para algo es listillo -->
    <ellipse cx="65" cy="67" rx="4" ry="5" fill="#2A2F5A"/>
    <path d="M91 68 Q96 63 101 68" stroke="#2A2F5A" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Mofletes y sonrisa de medio lado -->
    <ellipse cx="54" cy="86" rx="7" ry="4.5" fill="#FF9EC0"/>
    <ellipse cx="106" cy="86" rx="7" ry="4.5" fill="#FF9EC0"/>
    <path d="M72 86 Q82 94 92 84" stroke="#2A2F5A" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Lápiz detrás de la oreja -->
    <g transform="rotate(38 128 34)">
      <rect x="116" y="28" width="30" height="10" rx="2" fill="#FFC93C"/>
      <rect x="112" y="28" width="7" height="10" rx="2" fill="#FF9EC0"/>
      <path d="M146 28 L156 33 L146 38 Z" fill="#F5DEB3"/>
      <path d="M152.5 31.2 L156 33 L152.5 34.8 Z" fill="#2A2F5A"/>
    </g>
  </g>
</svg>
