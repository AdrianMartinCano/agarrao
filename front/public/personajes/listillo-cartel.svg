<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 230" role="img" aria-label="Listillo sujetando el cartel">
  <!--
    Listillo asomado por encima del cartel y agarrándolo con las dos manos. Las manos
    caen justo en el borde de abajo del dibujo (y = 222): la página lo coloca de modo que
    ese borde quede encima del borde rosa de la tarjeta, que es el cartel.
  -->
  <!-- Brazos, por detrás de la hoja -->
  <path d="M74 132 Q48 168 52 214" stroke="#2A2F5A" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M166 132 Q192 168 188 214" stroke="#2A2F5A" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- La hoja -->
  <g transform="rotate(-4 120 100)">
    <path d="M70 22 Q70 10 82 10 H158 Q170 10 170 22 V182 l-8 8 -8 -8 -8 8 -8 -8 -8 8 -8 -8 -8 8 -8 -8 -8 8 -8 -8 -8 8 -8 -8 -8 8 Z" fill="#FFFFFF"/>
    <path d="M70 22 Q70 10 82 10 H158 Q170 10 170 22 V44 H70 Z" fill="#E4DCFF"/>
    <g stroke-linecap="round">
      <path d="M92 150 H150" stroke="#D9D4EE" stroke-width="6"/>
      <path d="M92 166 H136" stroke="#D9D4EE" stroke-width="6"/>
      <path d="M80 149 l5 5 8-9" stroke="#FF4F8B" stroke-width="5" fill="none" stroke-linejoin="round"/>
      <path d="M80 165 l5 5 8-9" stroke="#FF4F8B" stroke-width="5" fill="none" stroke-linejoin="round"/>
    </g>
    <!-- Gafas -->
    <g fill="#FFFFFF" stroke="#2A2F5A" stroke-width="5">
      <circle cx="100" cy="80" r="15"/>
      <circle cx="140" cy="80" r="15"/>
    </g>
    <path d="M115 80 Q120 75 125 80" stroke="#2A2F5A" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <!-- Cara de «esto hay que hacerlo ya» -->
    <ellipse cx="101" cy="82" rx="5" ry="6" fill="#2A2F5A"/>
    <ellipse cx="141" cy="82" rx="5" ry="6" fill="#2A2F5A"/>
    <circle cx="103" cy="79.5" r="1.8" fill="#FFFFFF"/>
    <circle cx="143" cy="79.5" r="1.8" fill="#FFFFFF"/>
    <path d="M86 58 L110 62" stroke="#2A2F5A" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M154 58 L130 62" stroke="#2A2F5A" stroke-width="4.5" stroke-linecap="round"/>
    <ellipse cx="86" cy="106" rx="8" ry="5" fill="#FF9EC0"/>
    <ellipse cx="154" cy="106" rx="8" ry="5" fill="#FF9EC0"/>
    <ellipse cx="120" cy="114" rx="9" ry="7" fill="#2A2F5A"/>
    <ellipse cx="120" cy="117" rx="5" ry="3" fill="#FF7FA6"/>
    <!-- Lápiz -->
    <g transform="rotate(36 176 34)">
      <rect x="162" y="27" width="36" height="12" rx="2" fill="#FFC93C"/>
      <rect x="157" y="27" width="8" height="12" rx="2" fill="#FF9EC0"/>
      <path d="M198 27 L210 33 L198 39 Z" fill="#F5DEB3"/>
      <path d="M205.5 30.8 L210 33 L205.5 35.2 Z" fill="#2A2F5A"/>
    </g>
  </g>
  <!-- Las manos, encima de todo: agarran el borde del cartel -->
  <g fill="#FFFFFF" stroke="#2A2F5A" stroke-width="6">
    <ellipse cx="52" cy="216" rx="14" ry="10"/>
    <ellipse cx="188" cy="216" rx="14" ry="10"/>
  </g>
</svg>
