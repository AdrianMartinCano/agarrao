server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Listillo se llama Agarrao desde la 1.1.0 y vive en agarrao.pimon.dev (2026-10-13). El
    # dominio viejo sigue apuntado al mismo servicio solo para mandar a la gente (y a la PWA
    # instalada) al nuevo, con la misma ruta. Hace falta que Coolify tenga los dos dominios
    # en el servicio front.
    if ($host = listillo.pimon.dev) {
        return 301 https://agarrao.pimon.dev$request_uri;
    }

    # Comprimir texto
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API → backend (mismo origen, sin CORS). Mantiene el path /api/...
    location /api/ {
        proxy_pass http://back:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # El service worker, el índice y el manifest NO se cachean: así las
    # actualizaciones de la PWA llegan enseguida.
    location = /ngsw-worker.js { add_header Cache-Control "no-cache"; }
    location = /ngsw.json      { add_header Cache-Control "no-cache"; }
    location = /index.html     { add_header Cache-Control "no-cache"; }
    # El manifest, además, con su tipo MIME real. La imagen de nginx no conoce la
    # extensión .webmanifest y lo servía como application/octet-stream. Chrome instala
    # igual, pero otros navegadores son más tiquismiquis y no cuesta nada hacerlo bien.
    # El "types {}" vacío va DENTRO del location a propósito: a nivel de server
    # reemplazaría toda la tabla de tipos heredada y se romperían js, css e imágenes.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Recursos con hash en el nombre: caché larga
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA: cualquier ruta desconocida → index.html (Angular Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
